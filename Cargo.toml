[package]
name = "lianli-controller"
version = "0.1.0"
edition = "2024"
authors = ["Érycson Nóbrega"]
license = "MIT"
repository = "https://github.com/erycson/lianli-wireless-controller"
description = "Virtual Lian Li wireless dongle for L-Connect 3, backed by an ESP32-C3 RF Master"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
byteorder = "1.5"
nusb = "0.1"
windows = { version = "0.62.2", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_Foundation",
    "Win32_Devices_Communication",
    "Win32_System_Registry",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_Storage_FileSystem",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_Security",
    "Win32_System_Services",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[build-dependencies]
embed-resource = "3"
